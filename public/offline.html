<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<title>Cold-Grid · Offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #05070a; color: #e8eef5;
         font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #aeb9c7; margin: 0 0 20px; }
  button { background: #6fd3ff; color: #05070a; border: 0; border-radius: 12px; padding: 14px 20px; font-weight: 600; font-size: 16px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #fbbf24; display: inline-block; }
</style>
</head>
<body>
<main>
  <span class="dot"></span>
  <h1>No signal, and this screen isn’t cached yet</h1>
  <p>Screens you’ve already opened work offline. Emergency pins you drop are queued and sent the moment you reconnect.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
